<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Paws Paradise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <i class="fas fa-paw"></i>
                    <span>Paws Paradise</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-header">
                        <i class="fas fa-paw"></i>
                        <h1>Iniciar Sesión</h1>
                        <p>Ingresa con tu correo y contraseña</p>
                    </div>

                    <!-- ✅ FORMULARIO CON IDs CORRECTOS PARA JS -->
                    <form id="login-form" class="auth-form">
                        <div class="form-group">
                            <label for="email-login">
                                <i class="fas fa-envelope"></i> Correo Electrónico: <span class="required">*</span>
                            </label>
                            <input type="email" id="email-login" name="email" 
                                   placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password-login">
                                <i class="fas fa-lock"></i> Contraseña: <span class="required">*</span>
                            </label>
                            <input type="password" id="password-login" name="password" 
                                   placeholder="Tu contraseña" required>
                        </div>

                        <div class="form-group remember-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="remember-session">
                                <span>Recordar mi sesión</span>
                            </label>
                            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                        </div>

                        <!-- ✅ BOTÓN CON ID PARA LOADING -->
                        <button type="submit" class="btn-auth" id="btn-login">
                            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                        </button>

                        <p class="auth-redirect">
                            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                        </p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" id="contacto">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <div class="footer-logo">
                        <i class="fas fa-paw"></i>
                        <span>Paws Paradise</span>
                    </div>
                    <p class="footer-text">Cuidado y bienestar para quienes nos dan amor incondicional.</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 Paws Paradise. Todos los derechos reservados.</p>
                <p class="footer-disclaimer"><i class="fas fa-paw"></i> Hecho con amor para amigos peludos</p>
            </div>
        </div>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
